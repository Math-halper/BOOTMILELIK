    <rect x="56" y="272" width="34" height="6" fill="#5f6066"/>
    <rect x="35" y="292" width="30" height="7" fill="#f6f4ec"/>
    <rect x="64" y="311" width="18" height="18" fill="#050506"/>
    <rect x="273" y="286" width="11" height="11" fill="#f6f4ec"/>
  </g>

  <ellipse cx="160" cy="359" rx="92" ry="11" fill="#000" opacity=".34"/>


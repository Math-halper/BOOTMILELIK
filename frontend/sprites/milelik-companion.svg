<svg xmlns="http://www.w3.org/2000/svg" class="milelik-sprite" viewBox="-8 0 336 380" role="img" aria-labelledby="spriteTitle spriteDesc" focusable="false">
  <title id="spriteTitle">Milelik companion sprite</title>
  <desc id="spriteDesc">An original black-and-white angular glitch companion with a monitor-cat head, hoodie, boots and cable tail.</desc>
  <defs>
    <linearGradient id="spriteShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f5ee"/>
      <stop offset=".48" stop-color="#c9cac9"/>
      <stop offset="1" stop-color="#7d7e84"/>
    </linearGradient>
    <linearGradient id="spriteBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9d6cc"/>
    </linearGradient>
    <linearGradient id="spriteBoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7e6e0"/>
      <stop offset="1" stop-color="#8e9096"/>
    </linearGradient>
    <linearGradient id="spriteTail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76777d"/>
      <stop offset=".5" stop-color="#e2e1da"/>
      <stop offset="1" stop-color="#77787e"/>
    </linearGradient>
  </defs>

  <g class="sprite-pixels" aria-hidden="true">
    <rect x="38" y="91" width="17" height="7" fill="#050506"/>
    <rect x="50" y="103" width="18" height="18" fill="#050506"/>
    <rect x="63" y="121" width="10" height="10" fill="#f6f4ec"/>
    <rect x="253" y="83" width="28" height="28" fill="#5b5c62"/>

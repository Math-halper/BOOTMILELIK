  <path d="M151 154 C155 150 165 150 169 154 C167 159 153 159 151 154 Z" fill="#c9cac9"/>
  <path class="sprite-mouth" d="M146 163 Q153 171 160 164 Q167 171 174 163" fill="none" stroke="#e8e6df" stroke-width="4" stroke-linecap="round"/>
  <path d="M107 160 L121 163 M199 163 L213 160" stroke="#55565c" stroke-width="3" stroke-linecap="round"/>

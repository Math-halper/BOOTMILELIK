  <g transform="translate(5 22)">
    <path d="M31 157 C24 147 28 135 38 133 C39 123 51 118 58 125 C66 118 78 124 77 135 C86 141 84 154 75 158 C69 169 53 172 44 165 C38 164 34 161 31 157 Z" fill="#c9cac9" stroke="#050506" stroke-width="5" stroke-linejoin="round"/>
    <path d="M43 138 L47 152 M56 133 L58 149 M69 137 L67 152" stroke="#55565c" stroke-width="3" stroke-linecap="round"/>

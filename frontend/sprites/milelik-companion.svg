  <path d="M145 72 C141 59 145 48 154 41 C155 50 159 55 166 58 C159 59 155 63 154 70 C166 63 177 65 184 73 C172 78 156 78 145 72 Z" fill="#d9d8d2" stroke="#050506" stroke-width="4" stroke-linejoin="round"/>

  <rect class="sprite-face" x="90" y="83" width="140" height="113" rx="22" fill="#07080a" stroke="#050506" stroke-width="4"/>
  <path d="M102 94 C116 87 137 84 155 86 C138 94 119 104 105 117 C99 109 98 100 102 94 Z" fill="#fff" opacity=".13"/>

  <g class="sprite-eye sprite-eye-left">

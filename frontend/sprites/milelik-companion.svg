  <path d="M205 304 C238 309 259 287 254 252 C251 230 260 215 276 218" fill="none" stroke="#050506" stroke-width="25" stroke-linecap="round"/>
  <path d="M205 304 C238 309 259 287 254 252 C251 230 260 215 276 218" fill="none" stroke="url(#spriteTail)" stroke-width="16" stroke-linecap="round"/>
  <path d="M226 300 L223 315 M247 281 L238 293 M255 254 L241 257 M253 231 L240 226" stroke="#55565c" stroke-width="4" stroke-linecap="round"/>

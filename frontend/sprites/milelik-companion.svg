  <path d="M88 82 C88 57 94 38 105 27 C118 38 132 57 141 77 L119 94 C101 94 88 91 88 82 Z" fill="url(#spriteShell)" stroke="#050506" stroke-width="5" stroke-linejoin="round"/>
  <path d="M101 72 C102 59 106 48 112 41 C119 50 126 61 130 71 C121 79 109 80 101 72 Z" fill="#f7f5ee"/>
  <path d="M232 82 C232 57 226 38 215 27 C202 38 188 57 179 77 L201 94 C219 94 232 91 232 82 Z" fill="url(#spriteShell)" stroke="#050506" stroke-width="5" stroke-linejoin="round"/>

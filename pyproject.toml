[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "milelik"
dynamic = ["version"]
description = "Fast local AI web app for linux Mint"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Milelik contributors" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/Math-halper/BOOTMILELIK"
Repository = "https://github.com/Math-halper/BOOTMILELIK"

[project.scripts]
milelik = "milelik:main"
milelik-web = "milelik_web:main"
milelik-app = "app:main"
milelik-setup = "setup_milelik:main"
milelik-install = "install_milelik:main"
milelik-model-setup = "setup_model:main"
milelik-uninstall = "uninstall_milelik:main"

[tool.setuptools]
py-modules = ["app", "milelik", "milelik_web", "setup_milelik", "install_milelik", "setup_model", "uninstall_milelik"]

[tool.setuptools.dynamic]
version = { attr = "milelik.__version__" }

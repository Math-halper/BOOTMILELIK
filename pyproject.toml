[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "milelik"
dynamic = ["version"]
description = "Fast local AI assistant for linux Mint"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Milelik contributors" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/Math-halper/BOOTMILELIK"
Repository = "https://github.com/Math-halper/BOOTMILELIK"

[project.scripts]
milelik = "milelik:main"

[tool.setuptools]
py-modules = ["milelik"]

[tool.setuptools.dynamic]
version = { attr = "milelik.__version__" }
